# ============================================================================
#  Dashboard SMT — Contoh VirtualHost Apache (reverse proxy + security header)
# ============================================================================
#  Tujuan (M-03 / SECURITY_AUDIT_PRODUCTION_V2):
#   - Menyajikan SPA frontend (build Vite) dengan security header lengkap:
#     CSP, X-Frame-Options, HSTS, Referrer-Policy, X-Content-Type-Options.
#   - Mem-proxy /api dan /uploads ke backend Node (PM2) di 127.0.0.1:5000.
#
#  helmet di Express hanya melindungi respons API; index.html & bundle SPA
#  disajikan di luar Express sehingga header di bawah WAJIB diset di Apache.
#
#  Prasyarat modul Apache (sekali saja):
#    sudo a2enmod ssl headers proxy proxy_http rewrite
#    sudo systemctl restart apache2
#
#  Sesuaikan: ServerName, path SSLCertificate, DocumentRoot, dan daftar domain
#  pada img-src/connect-src (domain gambar API toko & bucket OSS).
# ============================================================================

# ── Redirect semua HTTP → HTTPS ──
<VirtualHost *:80>
    ServerName dashboard.serbamulia.com
    Redirect permanent / https://dashboard.serbamulia.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName dashboard.serbamulia.com

    # ── SSL (sesuaikan path sertifikat; mis. dari Let's Encrypt) ──
    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/dashboard.serbamulia.com/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/dashboard.serbamulia.com/privkey.pem

    # ── Root SPA (hasil: frontend/dist) ──
    DocumentRoot /var/www/dashboard-smt/frontend/dist

    # ── Security headers (always = ikut dikirim pada respons error juga) ──
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    # img-src: tambahkan domain CDN gambar toko & bucket OSS sesuai lingkungan Anda.
    Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://*.aliyuncs.com https://serbamas.cuan.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'"

    # ── Proxy ke backend Node (PM2) ──
    ProxyPreserveHost On
    ProxyPass        /api        http://127.0.0.1:5000/api
    ProxyPassReverse /api        http://127.0.0.1:5000/api
    ProxyPass        /uploads    http://127.0.0.1:5000/uploads
    ProxyPassReverse /uploads    http://127.0.0.1:5000/uploads

    # ── SPA fallback: route non-file diarahkan ke index.html (React Router) ──
    <Directory /var/www/dashboard-smt/frontend/dist>
        Options -Indexes
        AllowOverride None
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} -f [OR]
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteRule ^ - [L]
        RewriteRule ^ index.html [L]
    </Directory>
</VirtualHost>

# ── Verifikasi setelah diterapkan ──
#   curl -sI https://dashboard.serbamulia.com/ | grep -i -E \
#     'strict-transport|x-frame|content-security|referrer|x-content-type'
